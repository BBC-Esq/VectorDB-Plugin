<!doctype html>
<html lang="en" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Query Database</title>
<link rel="stylesheet" href="../../web_common/web/common.css">
<link rel="stylesheet" href="query_tab.css">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="../../web_common/web/common.js" defer></script>
<script src="query_markdown.js" defer></script>
<script src="query_tab.js" defer></script>
</head>
<body>
<main id="main">
  <section class="card convo-card" id="convo-card">
    <div id="convo-head"></div>
    <div id="convo" class="convo" tabindex="-1"></div>
  </section>
  <section class="card ask-card" id="ask-card">
    <div id="ask-controls"></div>
    <div id="ask-notes"></div>
    <label class="question-box" id="question-box">
      <textarea id="question" rows="3" placeholder="Ask a question about the selected database" spellcheck="true"></textarea>
    </label>
    <div id="ask-actions"></div>
  </section>
</main>
</body>
</html>
