<!doctype html>
<html lang="en" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Databases</title>
<link rel="stylesheet" href="../../web_common/web/common.css">
<link rel="stylesheet" href="manage_tab.css">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="../../web_common/web/common.js" defer></script>
<script src="manage_files.js" defer></script>
<script src="manage_tab.js" defer></script>
</head>
<body>
<main id="main">
  <section class="card dbs-card" id="dbs-card">
    <div id="dbs-head"></div>
    <div id="dbs-table" class="db-table" tabindex="0" role="listbox" aria-label="Databases"></div>
    <div id="dbs-foot"></div>
  </section>
  <section class="card detail-card" id="detail-card" hidden>
    <div id="detail-head"></div>
    <div id="detail-body"></div>
    <div id="files-section" class="files-section" hidden>
      <div id="files-head"></div>
      <div id="files-list" class="file-list" tabindex="0" role="listbox" aria-label="Files in the database">
        <div class="file-spacer"></div>
        <div class="file-rows"></div>
        <div class="file-empty"></div>
      </div>
      <div id="files-foot"></div>
    </div>
  </section>
</main>
</body>
</html>
